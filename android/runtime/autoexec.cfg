// AUTOEXEC.CFG d'OpenKatana, ajoute aux configs du port par l'appli.
// Execute apres daikatana13.cfg.

// Resolution = taille de l'ecran X virtuel, choisie par l'appli au format de l'ecran (16:9)
set r_mode_desktop "1"
set vid_fullscreen "1"
set vid_xpos "0"
set vid_ypos "0"

// Champ de vision adapte aux ecrans larges
set cl_widescreen_fov "1"
