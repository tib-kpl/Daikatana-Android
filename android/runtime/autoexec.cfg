// AUTOEXEC.CFG d'OpenKatana, ajoute aux configs du port par l'appli.
// Execute apres daikatana13.cfg.

// Resolution = taille de l'ecran X virtuel, choisie par l'appli au format de l'ecran (16:9)
set r_mode_desktop "1"
set vid_fullscreen "1"
set vid_xpos "0"
set vid_ypos "0"

// Champ de vision adapte aux ecrans larges
set cl_widescreen_fov "1"

// Manette : disposition FPS classique (le port PortMaster met le saut sur L1 et
// l'accroupissement sur A). Reappliquee a chaque lancement, comme gamecontroller.cfg.
bind JOY1 "+moveup"      // A : sauter
bind JOY2 "+movedown"    // B : s'accroupir
bind JOY3 "+use"         // X : utiliser (portes, boutons)
bind JOY4 "hud_cycle"    // Y : changer d'objet du HUD
bind AUX6 "hud_use"      // L1 : utiliser l'objet selectionne
bind AUX7 "+speed"       // R1 : courir
// L2/R2 : envoyees par l'appli comme touches Alt/Ctrl (gachettes mal gerees par le moteur)
bind ALT "+zoom"         // L2 : zoom
bind CTRL "+attack"      // R2 : tirer
unbind AUX31
unbind AUX32
