// AUTOEXEC.CFG - version Android (remplace cfgs/autoexec.cfg du port dans l'APK)
// Execute apres daikatana13.cfg.

// Mesa fournit l'OpenGL de bureau : le mode GLES du port (consoles PortMaster) donne des
// textures corrompues ici.
set gl_forcegles "0"

// Resolution = taille de l'ecran X virtuel, choisie par l'appli au format de l'ecran (16:9)
set r_mode_desktop "1"
set vid_fullscreen "1"
set vid_xpos "0"
set vid_ypos "0"

// Champ de vision adapte aux ecrans larges
set cl_widescreen_fov "1"
