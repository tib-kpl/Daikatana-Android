name: Release APK

# Chaque push sur main publie une release GitHub avec l'APK (version 0.3.<numero du build>).
# Lancement manuel possible (Actions > Release APK > Run workflow), avec la meme publication.
# Uniquement des runners ubuntu-latest (inclus dans le quota gratuit, y compris en prive) ;
# le runtime arm64 est construit sous emulation QEMU.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  runtime:
    name: Runtime Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Emulation arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Construction du rootfs (Debian trixie arm64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:trixie \
            sh /src/android/runtime/build-runtime.sh

      - uses: actions/upload-artifact@v5
        with:
          name: rootfs
          path: |
            android/runtime/out/rootfs.tgz
            android/runtime/out/packages.txt
          retention-days: 1 # quota de stockage limite en depot prive

  apk:
    name: APK
    needs: runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: rootfs
          path: android/runtime/out

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # SDK Android preinstalle sur les runners GitHub ($ANDROID_HOME)
      - name: SDK Android
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: proot (paquets Termux)
        run: python3 runtime/prepare-proot.py

      - name: Cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENKATANA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OPENKATANA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret OPENKATANA_KEYSTORE_BASE64 absent : APK signe avec une cle de debug"
          fi

      - name: Version
        run: |
          NAME="0.3.${GITHUB_RUN_NUMBER}"
          echo "OPENKATANA_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "OPENKATANA_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=OpenKatana-$NAME.apk" >> "$GITHUB_ENV"

      - name: Compilation
        env:
          OPENKATANA_KEYSTORE_PASSWORD: ${{ secrets.OPENKATANA_KEYSTORE_PASSWORD }}
          OPENKATANA_KEY_ALIAS: ${{ secrets.OPENKATANA_KEY_ALIAS }}
          OPENKATANA_KEY_PASSWORD: ${{ secrets.OPENKATANA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: android/${{ env.APK_NAME }}
          retention-days: 1 # l'APK durable est celle attachee a la release

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OpenKatana ${{ env.OPENKATANA_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            android/${{ env.APK_NAME }}
            android/runtime/out/packages.txt
          generate_release_notes: true
