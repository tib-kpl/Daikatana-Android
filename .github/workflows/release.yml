name: Release APK

# Publie une release GitHub avec l'APK quand un tag vX.Y.Z est pousse.
# Uniquement des runners ubuntu-latest (inclus dans le quota gratuit, y compris en prive) ;
# le runtime arm64 est construit sous emulation QEMU.
# Lancement manuel possible (Actions > Release APK > Run workflow) : l'APK est alors
# disponible en artefact du workflow, sans release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime:
    name: Runtime Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Emulation arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Construction du rootfs (Debian trixie arm64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:trixie \
            sh /src/android/runtime/build-runtime.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: android/runtime/out/rootfs.tgz
          retention-days: 1 # quota de stockage limite en depot prive

  apk:
    name: APK
    needs: runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: android/runtime/out

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: proot (paquets Termux)
        run: python3 runtime/prepare-proot.py

      - name: Cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENKATANA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OPENKATANA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret OPENKATANA_KEYSTORE_BASE64 absent : APK signe avec une cle de debug"
          fi

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "OPENKATANA_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "OPENKATANA_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APK_NAME=OpenKatana-$NAME.apk" >> "$GITHUB_ENV"

      - name: Compilation
        env:
          OPENKATANA_KEYSTORE_PASSWORD: ${{ secrets.OPENKATANA_KEYSTORE_PASSWORD }}
          OPENKATANA_KEY_ALIAS: ${{ secrets.OPENKATANA_KEY_ALIAS }}
          OPENKATANA_KEY_PASSWORD: ${{ secrets.OPENKATANA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/${{ env.APK_NAME }}
          retention-days: 1 # l'APK durable est celle attachee a la release

      - name: Release GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ env.APK_NAME }}
          generate_release_notes: true
