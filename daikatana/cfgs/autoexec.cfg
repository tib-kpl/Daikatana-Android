// AUTOEXEC.CFG - reglages ecran large (16:9)
// Copie dans savedata/gamedata par Daikatana.sh, execute apres daikatana13.cfg.

// Utilise la resolution native de l'ecran (16:9 sur un ecran 16:9)
set r_mode_desktop "1"
set vid_fullscreen "1"

// Adapte automatiquement le champ de vision (FOV) aux ecrans larges
set cl_widescreen_fov "1"

// Pour forcer une resolution 16:9 precise, decommenter UNE des options :
// set r_mode_desktop "0"
// set r_mode "15"            // 1280x720
// set r_mode "25"            // 1920x1080
// ou resolution libre :
// set r_mode "0"
// set r_customwidth "1280"
// set r_customheight "720"
